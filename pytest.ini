[pytest]
# Task 10: range_ladder.rank_hands / evaluate_pass2 parallelise onto a
# ProcessPoolExecutor (Windows spawn). pytest's default output capture
# ("fd") redirects file descriptors 1/2 at the OS level; the spawned
# worker's bootstrap inherits that redirected (and, across test boundaries,
# rotated/stale) handle and dies immediately, which surfaces as
# `concurrent.futures.process.BrokenProcessPool: A child process terminated
# abruptly` with no further detail. "sys" capture only monkeypatches
# sys.stdout/sys.stderr in this process instead of touching OS file
# descriptors, so spawned children get real, valid handles. Confirmed this
# is the actual cause (not a red herring): the same tests pass with -s
# (capture off entirely) or --capture=sys, and fail every time with the
# default fd capture, specifically on the tests whose inputs are large
# enough to take the parallel path.
addopts = --capture=sys
