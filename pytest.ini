[pytest]
# Task 10: range_ladder.rank_hands / evaluate_pass2 parallelise onto a
# ProcessPoolExecutor (Windows spawn). pytest's default output capture
# ("fd") redirects file descriptors 1/2 at the OS level; the spawned
# worker's bootstrap inherits that redirected (and, across test boundaries,
# rotated/stale) handle. "sys" capture only monkeypatches sys.stdout/
# sys.stderr in this process instead of touching OS file descriptors, so
# spawned children get real, valid handles.
#
# WHAT WAS OBSERVED, AND WHEN. During Task 10 (2026-08-13) the parallel
# range-ladder tests failed under the default fd capture with
# `concurrent.futures.process.BrokenProcessPool: A child process terminated
# abruptly` and no further detail, on exactly the tests whose inputs are
# large enough to take the parallel path, and passed with -s or
# --capture=sys.
#
# WHAT DID NOT REPRODUCE. At final review (2026-08-14) the whole suite was
# re-run under `--capture=fd` and PASSED (232 passed, 25 skipped), including
# with the numba disk cache deleted (87 passed). So the earlier claim here
# that these tests "fail every time with the default fd capture" is NOT
# reproducible today and has been removed. A later reader should expect fd
# capture to pass on a quiet box.
#
# WHY IT STAYS ANYWAY (ruled at final review). The original failure was
# real when observed and is plausibly load- or timing-dependent (a spawned
# child racing a rotated fd is exactly the shape of a heisenbug). The cost
# of keeping this setting is near zero -- no test in the repo uses
# capfd/capsys, so nothing observably changes -- while the cost of removing
# it is a flaky BrokenProcessPool at merge time. Keep it; do not re-argue
# it from the fd-capture run passing, because that run is already recorded
# above.
addopts = --capture=sys
